server:
  servlet:
    encoding:
      # Content-Type con charset=UTF-8 (PowerShell 5.1 asume ISO-8859-1 si falta)
      force: true
  port: 8082

spring:
  application:
    name: servicio-hoteles
  datasource:
    # Cada microservicio tiene su propia base de datos H2 (archivo local)
    url: jdbc:h2:file:./data/hoteles-db;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
